{% load static i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ error_status_code|default:'Error' }} | SSCEGOV</title>
    <link rel="icon" href="{% static 'web/file/images/logoSSC-blue.png' %}" type="image/x-icon">
    <style>
        :root { color-scheme: light; --error-ink: #17233d; --error-muted: #66758f; --error-line: #e1e8f2; --error-blue: #3158d5; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 8px; color: var(--error-ink); background: #f5f8fd; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
</head>
<body>{% block content %}{% endblock %}</body>
</html>
