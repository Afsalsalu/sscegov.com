{% extends "web/admin_panel/base.html" %} 
{% load static %} 
{% block content %}

<link rel="stylesheet" href="{% static 'web/css/non.css' %}" />

<div class="relative min-h-screen group-data-[sidebar-size=sm]:min-h-sm">
  <div
    class="group-data-[sidebar-size=lg]:ltr:md:ml-vertical-menu group-data-[sidebar-size=lg]:rtl:md:mr-vertical-menu group-data-[sidebar-size=md]:ltr:ml-vertical-menu-md group-data-[sidebar-size=md]:rtl:mr-vertical-menu-md group-data-[sidebar-size=sm]:ltr:ml-vertical-menu-sm group-data-[sidebar-size=sm]:rtl:mr-vertical-menu-sm pt-[calc(theme('spacing.header')_*_1)] pb-[calc(theme('spacing.header')_*_0.8)] px-4 group-data-[navbar=bordered]:pt-[calc(theme('spacing.header')_*_1.3)] group-data-[navbar=hidden]:pt-0 group-data-[layout=horizontal]:mx-auto group-data-[layout=horizontal]:max-w-screen-2xl group-data-[layout=horizontal]:px-0 group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:ltr:md:ml-auto group-data-[layout=horizontal]:group-data-[sidebar-size=lg]:rtl:md:mr-auto group-data-[layout=horizontal]:md:pt-[calc(theme('spacing.header')_*_1.6)] group-data-[layout=horizontal]:px-3 group-data-[layout=horizontal]:group-data-[navbar=hidden]:pt-[calc(theme('spacing.header')_*_0.9)]"
  >
    <div class="container-fluid group-data-[content=boxed]:max-w-boxed mx-auto">
      <h4 class="py-5"></h4>

      <form action="#!" class="mb-5">
        <div class="grid grid-cols-1 gap-5 lg:grid-cols-12">
          <div class="relative lg:col-span-4 xl:col-span-3">
            <input
              type="text"
              class="ltr:pl-8 rtl:pr-8 search form-input border-slate-200 dark:border-zink-500 focus:outline-none focus:border-custom-500 disabled:bg-slate-100 dark:disabled:bg-zink-600 disabled:border-slate-300 dark:disabled:border-zink-500 dark:disabled:text-zink-200 disabled:text-slate-500 dark:text-zink-100 dark:bg-zink-700 dark:focus:border-custom-800 placeholder:text-slate-400 dark:placeholder:text-zink-200"
              placeholder="Search for name, email, phone number etc..."
              autocomplete="off"
            />
            <i
              data-lucide="search"
              class="inline-block size-4 absolute ltr:left-2.5 rtl:right-2.5 top-2.5 text-slate-500 dark:text-zink-200 fill-slate-100 dark:fill-zink-600"
            ></i>
          </div>
          <div class="lg:col-span-6 lg:col-start-10">
            <div class="flex gap-2 lg:justify-end">
              <a href="{% url 'web:software_add' %}">
                <button
                  data-modal-target="addUserModal"
                  type="button"
                  class="text-white btn bg-custom-500 border-custom-500 hover:text-white hover:bg-custom-600 hover:border-custom-600 focus:text-white focus:bg-custom-600 focus:border-custom-600 focus:ring focus:ring-custom-100 active:text-white active:bg-custom-600 active:border-custom-600 active:ring active:ring-custom-100 dark:ring-custom-400/20"
                >
                  <i data-lucide="plus" class="inline-block size-4"></i>
                  <span class="align-middle">Add software</span>
                </button>
              </a>
            </div>
            
          </div>
        </div>
      </form>
    </div>
  <div class="grid grid-cols-12 2xl:grid-cols-12 gap-x-5">
    {% for obj in softwares %}
    <div class="col-span-12 card md:col-span-6 lg:col-span-3 2xl:col-span-2" style="border: 1px solid;">
      <div class="" style="background-color: antiquewhite">
        <div class="card-body text-center">
          <div class="flex items-center justify-center mx-auto rounded-full size-14 bg-custom-100 text-custom-500 dark:bg-custom-500/20">
            <img class"mb-3" src="{{ obj.logo.url }}" alt="">
          </div>
          <h5 class="pt-2 hard">{{ obj.title }}</h5>
        </div>
      </div>
      <h6 class="pt-2 hard"></h6>
      <div class="container text-center pt-2 mb-4">
        {% if obj.site_link %}
        <a href="{{ obj.site_link }}" target="_blank"
          style="
            color: white;
            background: green;
            padding: 5px;
          "
          >View</a>
        {% else %}
        <span style="color: red">Link not available</span>
        {% endif %}
        <a href="#!"
          style="
            color: white;
            background: #0069d9;
            padding: 5px;
          ">Edit</a>
        <a href="#" class="delete-service"
          data-url="#!"
          style="
            color: white;
            border: #0062cc;
            background: #bd2130;
            padding: 5px;
          ">Delete</a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll('.delete-service').forEach(button => {
    button.addEventListener('click', function(event) {
      event.preventDefault();
      if (confirm("Are you sure you want to delete this service?")) {
        fetch(button.getAttribute('data-url'), {
          method: 'DELETE',
          headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({})
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            button.closest('.col-span-12').remove();
          } else {
            alert("Failed to delete the service.");
          }
        });
      }
    });
  });
});
</script>

{% endblock %}
