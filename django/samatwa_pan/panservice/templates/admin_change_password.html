{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Change User Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Sora', sans-serif;
            background: skyblue;
            margin: 0;
        }

        /* MAIN CONTENT */

        .main-content {
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        /* CARD */

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        /* FORM */

        label {
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
        }

        button:hover {
            opacity: 0.9;
        }

        /* USER INFO */

        .user-info {
            font-size: 14px;
            margin-bottom: 20px;
            color: #444;
        }

        /* MOBILE */

        @media(max-width:768px) {

            .main-content {
                padding: 20px;
            }

            .card {
                width: 100%;
            }

        }
    </style>

</head>


<body>

    <!-- ADMIN TOPBAR -->
    {% include 'partials/admin_topbar.html' %}

    <div class="main-content">

        <div class="card">

            <h3>Change Password</h3>

            <div class="user-info">
                User: <strong>{{ target_user.username }}</strong>
            </div>

            <form method="POST">

                {% csrf_token %}

                <label>New Password</label>
                <input type="password" name="password" required>

                <button type="submit">
                    Update Password
                </button>

            </form>

        </div>

    </div>

</body>

</html>
