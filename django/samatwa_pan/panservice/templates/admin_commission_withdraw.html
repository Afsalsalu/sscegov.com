<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ===== BODY ===== */
        body {
            font-family: 'Sora', sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
            color: #1a2a3a;
        }

        /* ===== MAIN CONTENT (SIDEBAR SAFE) ===== */
        .main-content {
            margin-left: 260px;          /* 🔥 sidebar fix */
            padding: 100px 20px 40px;    /* space for topbar */
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        /* ===== WRAPPER ===== */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== TITLE ===== */
        h4 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* ===== BALANCE TEXT ===== */
        p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        p strong {
            color: #0a1628;
        }

        p {
            color: #16a34a;
            font-weight: 600;
        }

        /* ===== FORM CARD ===== */
        form {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        /* ===== INPUT ===== */
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            transition: 0.3s;
        }

        /* FOCUS */
        input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
        }

        /* ===== BUTTON ===== */
        button {
            margin-top: 18px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0a1628, #1e2937);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        /* HOVER */
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {

            .main-content {
                margin-left: 0;   /* 🔥 remove sidebar */
                padding: 90px 15px 30px;
            }

            form {
                padding: 20px;
            }

            h4 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    {% include 'partials/admin_topbar.html' %}
    <div class="main-content">
        <h4 class="mb-3">Admin Commission Withdraw</h4>
        <p><strong>Your Commission Balance:</strong> ₹{{ wallet.balance }}</p>

        <form method="post">
            {% csrf_token %}
            <input type="number" step="0.01" min="1" name="amount" class="form-control" placeholder="Enter Amount">
            <button type="submit" class="btn btn-primary w-100 mt-3">Withdraw</button>
        </form>
    </div>

</body>

</html>
