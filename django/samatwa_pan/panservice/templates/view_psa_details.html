{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSA Login Details</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #f0f4ff;
            font-family: "Poppins", sans-serif;
        }
        .login-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-left: 6px solid #0d6efd;
        }
        h3 {
            color: #0d6efd;
            font-weight: 600;
        }
        .details p {
            font-size: 17px;
            margin-bottom: 10px;
        }
        .btn-secondary {
            border-radius: 6px;
        }
        .alert a {
            font-weight: 700;
            text-decoration: underline;
            color: #0d6efd;
        }
        .alert strong {
            color: #d9534f;
        }
    </style>
</head>

<body>

<div class="container mt-5 d-flex justify-content-center">
    <div class="login-box col-md-6">

        <h3 class="text-center mb-4">PSA Login Details</h3>

        <div class="details">
            <p><strong>Username:</strong> {{ req.psa_username }}</p>
            <p><strong>Password:</strong> {{ req.psa_password }}</p>
        </div>

        <div class="alert alert-warning mt-4">
            <a href="https://www.psaonline.utiitsl.com/psapanservices/forms/login.html/loginHome" target="_blank">
                Click here to Login
            </a>
        </div>

        <a href="{% url 'my_coupon_requests' %}" class="btn btn-secondary w-100 mt-3">
            Back
        </a>

    </div>
</div>

</body>
</html>
