{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approve Coupon Purchase</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<style>

*{box-sizing:border-box;margin:0;padding:0;}

:root{
    --navy:#0a1628;
    --bg:skyblue;
    --card:#ffffff;
    --border:#e2e8f0;
    --text:#1a2a3a;
    --green:#16a34a;
}

body{
    font-family:'Sora',sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* CONTENT */

.main-content{
    padding:32px 36px;
    max-width:600px;
}

/* TITLE */

.page-header{
    margin-bottom:22px;
}

.page-header h2{
    font-size:20px;
    font-weight:700;
    color:var(--navy);
}

/* CARD */

.card{
    background:var(--card);
    border-radius:16px;
    border:1.5px solid var(--border);
    padding:24px;
}

/* INFO BOX */

.info-box{
    background:#f8fafc;
    padding:14px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:14px;
}

.info-box p{
    margin-bottom:6px;
}

/* FORM */

form{
    display:flex;
    flex-direction:column;
    gap:14px;
}

label{
    font-size:13px;
    font-weight:600;
}

input{
    padding:10px;
    border-radius:8px;
    border:1px solid var(--border);
    font-size:14px;
}

/* BUTTON */

.btn-submit{
    background:var(--green);
    color:white;
    border:none;
    padding:10px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.btn-submit:hover{
    opacity:0.9;
}

/* RESPONSIVE */

@media(max-width:768px){
    .main-content{padding:70px 16px;}
}

</style>
</head>

<body>

{% include 'partials/admin_topbar.html' %}

<div class="main-content">

<div class="page-header">
    <h2>Approve Coupon Purchase </h2>
</div>

<div class="card">

<div class="info-box">
    <p><strong>User:</strong> {{ req.user.username }}</p>
    <p><strong>Quantity:</strong> {{ req.quantity }}</p>
    <p><strong>Total Amount:</strong> {{ req.total_amount }}</p>
</div>

<form method="POST">
    {% csrf_token %}

    <div>
        <label>Select PSA Login ID</label>
        <select id="psaDropdown" name="psa_id" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: 'Sora', sans-serif;">
            <option value="" disabled selected>-- Select PSA --</option>
            {% for psa in available_psas %}
                <option value="{{ psa.id }}" data-password="{{ psa.psa_password }}" data-balance="{{ psa.balance|default_if_none:'' }}">{{ psa.psa_login_id }} (Balance: {% if psa.balance %}{{ psa.balance }}{% else %}Empty{% endif %})</option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label>PSA Login Password</label>
        <input type="text" id="psaPassword" readonly placeholder="Password will auto-fill" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: 'Sora', sans-serif; background-color: #f1f5f9; cursor: not-allowed; color: #64748b;">
    </div>

    <div>
        <label>PSA Balance</label>
        <input type="number" step="0.01" id="psaBalance" name="psa_balance" placeholder="Enter or auto-fill balance" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: 'Sora', sans-serif;">
    </div>

    <div id="topupDiv" style="display: none;">
        <label>Top Up Balance</label>
        <input type="number" step="0.01" id="topupBalance" name="topup_balance" placeholder="Enter top-up amount" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: 'Sora', sans-serif;">
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#psaDropdown').select2({
                placeholder: "-- Select PSA --",
                allowClear: true
            });

            $('#psaDropdown').on('change', function() {
                var selectedOption = $(this).find(':selected');
                var password = selectedOption.attr('data-password');
                var balance = selectedOption.attr('data-balance');
                
                $('#psaPassword').val(password ? password : '');
                
                var balanceInput = document.getElementById('psaBalance');
                var topupDiv = document.getElementById('topupDiv');
                var topupInput = document.getElementById('topupBalance');

                if (balance && balance.trim() !== '') {
                    balanceInput.value = balance;
                    balanceInput.readOnly = true;
                    balanceInput.style.backgroundColor = '#f1f5f9';
                    balanceInput.style.cursor = 'not-allowed';
                    balanceInput.style.color = '#64748b';
                    
                    // Show Top Up field
                    topupDiv.style.display = 'block';
                    topupInput.value = '';
                } else {
                    balanceInput.value = '';
                    balanceInput.readOnly = false;
                    balanceInput.style.backgroundColor = '#fff';
                    balanceInput.style.cursor = 'text';
                    balanceInput.style.color = '#1a2a3a';
                    
                    // Hide Top Up field
                    topupDiv.style.display = 'none';
                    topupInput.value = '';
                }
            });
        });
    </script>

    <button type="submit" class="btn-submit">
        Approve & Assign PSA
    </button>
</form>

</div>

</div>

</body>
</html>
