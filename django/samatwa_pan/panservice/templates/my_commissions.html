<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Commission Earnings</h3>
<p><strong>Total:</strong> ₹{{ total_commission }}</p>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>From</th>
            <th>Level</th>
            <th>Amount</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody>
        {% for c in commissions %}
        <tr>
            <td>{{ c.from_user.username }}</td>
            <td>{{ c.level }}</td>
            <td>₹{{ c.amount }}</td>
            <td>{{ c.created_at|date:"d-m-Y H:i" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No commissions earned yet.</td></tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
