{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Retailer</title>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --navy: #0a1628;
            --bg: skyblue;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1a2a3a;
            --green: #16a34a;
        }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* PAGE */

        .main-content {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* WRAPPER */

        .form-wrapper {
            width: 520px;
        }

        /* HEADER */

        .page-header {
            margin-bottom: 18px;
        }

        .page-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--navy);
        }

        /* CARD */

        .form-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1.5px solid var(--border);
            padding: 22px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 14px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1.5px solid var(--border);
            font-size: 13px;
        }

        /* BUTTON */

        button {
            margin-top: 10px;
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            background: var(--green);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .back-link {
            display: inline-block;
            margin-top: 14px;
            font-size: 13px;
            text-decoration: none;
            color: var(--navy);
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

    {% include 'partials/admin_topbar.html' %}

    <div class="main-content">

        <div class="form-wrapper">

            <div class="page-header">
                <h2>Create Retailer</h2>
            </div>

            <div class="form-card">

                <form method="POST">

                    {% csrf_token %}

                    <!-- USER MODEL -->

                    <div class="form-group">
                        <label>Mobile</label>
                        <input type="text" name="mobile" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email">
                    </div>


                    <!-- STATE / DISTRICT -->

                    {% if role == 'admin' %}

                    <div class="form-group">
                        <label>State</label>
                        <select name="state" required>
                            <option value="">Select State</option>

                            {% for s in states %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>District</label>
                        <select name="district">
                            <option value="">Select District</option>

                            {% for d in districts %}
                            <option value="{{ d.id }}">{{ d.name }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    {% elif role == 'state' %}

                    <div class="form-group">
                        <label>District</label>
                        <select name="district">
                            <option value="">Select District</option>

                            {% for d in districts %}
                            <option value="{{ d.id }}">{{ d.name }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    {% endif %}


                    <!-- USER PROFILE MODEL -->

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" name="dob">
                    </div>

                    <div class="form-group">
                        <label>PAN</label>
                        <input type="text" name="pan">
                    </div>

                    <div class="form-group">
                        <label>Aadhaar</label>
                        <input type="text" name="aadhaar">
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <textarea name="address"></textarea>
                    </div>

                    <div class="form-group">
                        <label>PIN Code</label>
                        <input type="text" name="pin_code">
                    </div>

                    <button type="submit">Create Retailer</button>

                </form>

            </div>

            <a href="javascript:history.back()" class="back-link">
                ⬅ Back
            </a>

        </div>

    </div>

</body>

</html>
